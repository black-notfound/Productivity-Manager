<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script defer src="js/calendar.js"></script>
    <script defer src="js/general.js"></script>
    <title>Productivity Manager</title>
</head>

<body>
    <nav id="navbar" class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand">Productivity Manager</a>
            <div class="buttons">
                <button class="navButton"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="lucide lucide-house w-5 h-5"
                        data-fg-h9b10="7.43:7.2944:/src/app/components/Navigation.tsx:39:19:1413:28:e:Icon">
                        <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path>
                        <path
                            d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z">
                        </path>
                    </svg>Dashboard</button>
                <button class="navButton">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-chart-column w-5 h-5"
                        data-fg-h9b10="7.43:7.2944:/src/app/components/Navigation.tsx:39:19:1413:28:e:Icon">
                        <path d="M3 3v16a2 2 0 0 0 2 2h16"></path>
                        <path d="M18 17V9"></path>
                        <path d="M13 17V5"></path>
                        <path d="M8 17v-3"></path>
                    </svg>Time analysis</button>
                <button id="theme" onclick=changeTheme() class="navButton">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-moon w-5 h-5"
                        data-fg-h9b22="7.43:87.1252:/src/app/components/Navigation.tsx:69:17:2654:28:e:Moon::::::EBzq">
                        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                    </svg></button>
            </div>
        </div>
    </nav> <!-- Navbar-->
    <div id="mainContainer" class="main-container">
        <!-- title -->
        <div class="title">
            <div class="titleDiv">
                <h1>Dashboard</h1>
                <span>Plan your day and manage your tasks</span>
            </div>
            <div class="taskButtonDiv">
                <button class="taskButton">+ Add new task</button>
            </div>
        </div>
        <div class="mainContent">
            <!-- Calendar -->
            <div id="calendar">

            </div>
            <div class="tasks">
                <div class="taskHeader">
                    <h3>Todays tasks</h3>
                </div>
                <div class="taskContent">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-circle w-12 h-12 text-gray-300 mx-auto mb-3"
                        data-fg-0dv5="7.44:7.3859:/src/app/components/TodaysTasks.tsx:52:11:1472:59:e:Circle::::::odR">
                        <circle cx="12" cy="12" r="10"></circle>
                    </svg>
                    No tasks scheduled for today
                </div>
                <div class="taskFooter">
                    <span>Completed</span>
                    <span>0/0</span>
                </div>
            </div>
        </div> <!--Main content-->
    </div> <!--Main container-->
</body>

</html>
